name: iOS Deploy

# Shared Capacitor deploy (johnpc/ci-workflows): web build + cap sync, launch smoke
# in a fresh simulator, CI-keychain signing, archive, upload, external TestFlight.
# DEPLOY_PAT (via secrets: inherit) checks out and opens the version-bump PR, so
# that PR runs CI (`test`, `ios-launch`) and auto-merges into the protected main.
# Never submits for App Store review.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: johnpc/ci-workflows/.github/workflows/ios-deploy-capacitor.yml@v1
    secrets: inherit
    with:
      bundle-id: com.johncorser.countdowns
      archive-name: Countdowns
      ref: main
      config-command: npm run prod-config # retries DeploymentInProgressError (Amplify race)
      external-beta: true
      bump: patch
