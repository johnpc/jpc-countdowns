name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright doesn't support ubuntu-latest (26.04) yet
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - name: Generate amplify_outputs.json (retries on in-progress deploy)
        run: npm run prod-config
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: File-length discipline (max 100 lines)
        run: npm run check:lines
      - name: Unit tests with coverage (80% floor) + CRAP (threshold 15)
        run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Proves the iOS app actually launches. Runs on the same Mac mini (Xcode 27)
  # that archives the App Store build, so a launch regression blocks the merge
  # instead of reaching TestFlight. See scripts/ios-launch-smoke.sh.
  ios-launch:
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # No setup-node cache on the self-hosted Mac mini: ~/.npm persists there.
      - run: npm ci
      - name: Generate amplify_outputs.json (retries on in-progress deploy)
        run: npm run prod-config
      - name: Build web and sync to Capacitor iOS
        run: |
          npm run build
          npx cap sync ios
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install
      - name: Build, install, launch in a fresh iOS Simulator and verify it stays up
        env:
          SMOKE_WEB_BUILD: "0"
          SMOKE_OUT: smoke-results
        run: bash scripts/ios-launch-smoke.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-launch-smoke
          # The smoke's DerivedData lives under smoke-results/ too; keep it out.
          path: |
            smoke-results/
            !smoke-results/DerivedData/
          retention-days: 7
